<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="680" height="560" role="img">
<title>门锁菜单逻辑流程图</title>
<desc>main 主循环调用 menu1 一级菜单，menu1 内部按键轮询：上下键回绕移动选中项，确认键清屏并返回选中项编号。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="560" fill="#FFFFFF"/>

<text x="145" y="30" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">main.c</text>
<text x="485" y="30" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">menu1() 一级菜单</text>

<g>
  <rect x="60" y="60" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="145" y="82" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">OLED_Init / Key_Init</text>
</g>
<path d="M145,104 V140" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
  <rect x="60" y="140" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="145" y="162" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">menu2 = menu1()</text>
</g>
<path d="M145,184 V220" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
  <rect x="60" y="220" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="145" y="240" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">switch (menu2)</text>
  <text x="145" y="258" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">5 个分支均待实现</text>
</g>
<path d="M60,248 H46 V162 H58" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M230,162 H300 V80 H378" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="380" y="52" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="485" y="72" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041">flag = 1，初始显示</text>
  <text x="485" y="90" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">密码/指纹/手机/RFID 四行</text>
</g>
<path d="M485,108 V146" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
  <rect x="380" y="146" width="210" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="485" y="166" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041">KeyNum = Key_GetNum()</text>
  <text x="485" y="184" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">1=上(PB11) 2=下(PB1) 3=确认(PA6)</text>
</g>
<path d="M485,202 V248" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<polygon points="485,250 570,286 485,322 400,286" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="485" y="286" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#633806">KeyNum ?</text>

<path d="M400,286 H330 V354" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M485,322 V354" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M570,286 H580 V354" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="280" y="356" width="100" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="330" y="376" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041">键1 上</text>
  <text x="330" y="394" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">到顶回绕到5</text>
</g>
<g>
  <rect x="405" y="356" width="100" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="455" y="376" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#633806">键3 确认</text>
  <text x="455" y="394" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">清屏 return flag</text>
</g>
<g>
  <rect x="530" y="356" width="100" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="580" y="376" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041">键2 下</text>
  <text x="580" y="394" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">到底回绕到1</text>
</g>

<path d="M405,384 H250 V248 H232" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M330,412 V452" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M580,412 V452" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="300" y="452" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="470" y="472" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041">switch (flag) 刷新显示：反显选中行</text>
  <text x="470" y="490" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">case5：窗口上移一行，露出「功能设置」</text>
</g>
<path d="M640,480 H648 V174 H592" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="534" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">注：Key_GetNum() 消抖后阻塞等松手，每次循环最多响应一个键；确认后回到 main 的 switch 分发</text>
</svg>
