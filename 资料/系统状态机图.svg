<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img">
<title>门锁系统状态机图</title>
<desc>时钟待机、一级菜单、二级菜单三个状态，事件驱动转移；密码输入和指纹验证是预留的 stub 状态。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5"
    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>

<g>
  <rect x="60" y="200" width="170" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="145" y="224" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041">时钟待机</text>
  <text x="145" y="244" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#0F6E56">非阻塞轮询 + 刷时间</text>
</g>
<g>
  <rect x="440" y="60" width="180" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="530" y="80" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">一级菜单</text>
  <text x="530" y="98" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#185FA5">menu1()</text>
</g>
<g>
  <rect x="440" y="340" width="180" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="530" y="360" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#0C447C">二级菜单 ×5</text>
  <text x="530" y="378" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#185FA5">menu2_xxx()</text>
</g>
<g>
  <rect x="60" y="360" width="160" height="48" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="140" y="384" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#633806">密码输入 (stub)</text>
</g>
<g>
  <rect x="250" y="360" width="160" height="48" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="330" y="384" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#633806">指纹验证 (stub)</text>
</g>

<path d="M165,200 V88 H438" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280" y="80" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">确认键</text>

<path d="M460,116 V160 H125 V198" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="272" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">4秒无操作 / 选第6项</text>

<path d="M530,116 V338" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="598" y="230" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">确认1~5项</text>

<path d="M440,368 H145 V266" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280" y="360" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">return / 选「←」</text>

<path d="M110,264 V358" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
<text x="60" y="316" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">键盘按键</text>

<path d="M180,264 V320 H330 V358" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
<text x="240" y="312" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#854F0B">指纹触摸</text>
</svg>
