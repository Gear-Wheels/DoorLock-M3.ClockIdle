<g>
  <rect x="720" y="1050" width="170" height="42" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="805" y="1066" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#0C447C">View / Add / Del_FR</text>
  <text x="805" y="1084" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#5F5E5A">查看 / 录入 / 删除</text>
