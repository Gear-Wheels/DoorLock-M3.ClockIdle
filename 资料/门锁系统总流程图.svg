  <text x="270" y="490" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#085041">menu1() 一级菜单</text>
  <text x="270" y="508" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#0F6E56">密码/指纹/手机/RFID/功能设置</text>
</g>

<g>
  <rect x="490" y="472" width="180" height="48" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="0.5"/>
  <text x="580" y="490" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#7A1F1F">CodedLock() 密码解锁</text>
  <text x="580" y="508" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#9B3B2E">默认密码 952700</text>
</g>

<g>
  <rect x="690" y="472" width="190" height="48" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="0.5"/>
  <text x="785" y="490" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="14" font-weight="500" fill="#7A1F1F">menu2_fingerprint()</text>
  <text x="785" y="508" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#9B3B2E">press_FR() 采集→搜索</text>
</g>

<path d="M270,520 V558" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<polygon points="270,560 360,592 270,624 180,592" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="270" y="592" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" font-weight="500" fill="#633806">menu1 返回 choice</text>

<path d="M180,592 H130 V990" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M250,592 H250 V1040" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M330,592 H390 V1040" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360,592 H430 V1040" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M270,624 V990" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="150" y="620" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">1 密码</text>
<text x="238" y="620" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">2 指纹</text>
<text x="318" y="620" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">3 手机</text>
<text x="400" y="620" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">4 RFID</text>
<text x="282" y="640" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#5F5E5A">5 功能设置</text>

<g>
  <rect x="90" y="992" width="140" height="46" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="0.5"/>
  <text x="160" y="1010" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#7A1F1F">menu2_password</text>
  <text x="160" y="1028" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#9B3B2E">→ CodedLock</text>
