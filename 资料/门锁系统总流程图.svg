<g>
  <rect x="180" y="1042" width="140" height="46" rx="8" fill="#FBE9E7" stroke="#C0392B" stroke-width="0.5"/>
  <text x="250" y="1060" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#7A1F1F">menu2_fingerprint</text>
  <text x="250" y="1078" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#9B3B2E">→ press_FR</text>
