<path d="M710,1071 H720" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="28" y="1124" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5F5E5A">④ 菜单层无操作 4 秒 → return -1 逐层上抛 → 回待机；待机层无操作 12 秒 → 熄屏进 Stop → EXTI 唤醒回活跃态</text>
<text x="28" y="1152" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#888780">红色=开锁/确认　蓝色=初始化　绿色=菜单　橙=判断　紫=低功耗　灰=预留/说明</text>
