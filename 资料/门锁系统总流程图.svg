  <text x="625" y="1016" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="12.5" font-weight="500" fill="#085041">ChangePassword 密码修改</text>
  <text x="625" y="1034" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10" fill="#0F6E56">验证→输新→确认→成功</text>
