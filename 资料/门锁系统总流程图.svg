  <text x="305" y="1010" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" font-weight="500" fill="#085041">menu2_config 功能设置</text>
  <text x="305" y="1028" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#0F6E56">密码修改/指纹设置/RFID设置</text>
</g>

<path d="M390,992 H540 V1042" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
