<g>
  <rect x="360" y="1042" width="140" height="46" rx="8" fill="#EDEDEB" stroke="#888780" stroke-width="0.5"/>
  <text x="430" y="1060" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#5F5E5A">menu2_RFID</text>
  <text x="430" y="1078" text-anchor="middle" dominant-baseline="central" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="10.5" fill="#888780">预留</text>
</g>

